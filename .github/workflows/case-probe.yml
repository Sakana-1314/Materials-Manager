name: 临时验证 GHCR 路径

# 仅用于验证 ghcr.io/<owner>/<image> 的大小写行为，验证后即删除。
on:
  push:
    branches: [fix/ghcr-image-path]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 登录 GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 用「大小写原样」的 owner 路径推送一个最小镜像
        run: |
          set -x
          printf 'FROM alpine:3.20\n' > /tmp/probe.Dockerfile
          docker buildx build --push -f /tmp/probe.Dockerfile --platform linux/amd64 \
            -t "ghcr.io/${{ github.repository_owner }}/case-probe:probe" /tmp
