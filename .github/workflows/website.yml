name: 构建并发布项目站点

# 在 main 上构建 docs/websites 的 VitePress 站点，推送到 gh-pages 分支，由 GitHub Pages 发布。
# 站点地址：https://sakana-1314.github.io/Electrical-Manager/
on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - ".github/workflows/website.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: website-${{ github.ref }}
  cancel-in-progress: true

env:
  # 构建到工作区目录之外，再以全新历史提交，避免把源码树带进 gh-pages。
  SITE_OUT_DIR: ${{ github.workspace }}/.site-dist

jobs:
  deploy:
    name: 构建并发布到 gh-pages
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: docs/websites/package-lock.json

      - name: 安装站点依赖
        working-directory: docs/websites
        run: npm ci

      - name: 构建站点
        working-directory: docs/websites
        run: npx vitepress build --outDir "$SITE_OUT_DIR"

      - name: 发布到 gh-pages 分支
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          cd "$SITE_OUT_DIR"
          touch .nojekyll
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git add -A
          git commit -q -m "docs: 发布站点（${GITHUB_SHA::7}）"
          # gh-pages 只承载构建产物，每次整体替换。
          git push --force origin gh-pages
          echo "已发布到 gh-pages"
